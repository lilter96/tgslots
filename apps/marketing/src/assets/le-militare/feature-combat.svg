<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="8" fill="#1a2e1f"/>
  <!-- Missile launch -->
  <rect x="26" y="44" width="12" height="8" rx="2" fill="#b0b0b0"/>
  <rect x="28" y="36" width="8" height="10" rx="1" fill="#c41e1e"/>
  <polygon points="32,28 36,36 28,36" fill="#ff4444"/>
  <!-- Explosion at target -->
  <circle cx="48" cy="16" r="8" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
  <line x1="48" y1="8" x2="48" y2="4" stroke="#d4af37" stroke-width="2"/>
  <line x1="56" y1="16" x2="60" y2="16" stroke="#d4af37" stroke-width="2"/>
  <line x1="53" y1="11" x2="56" y2="8" stroke="#d4af37" stroke-width="2"/>
  <!-- Laser beam -->
  <line x1="32" y1="30" x2="48" y2="16" stroke="#ff4444" stroke-width="2" opacity="0.9"/>
  <!-- Plane (target) -->
  <polygon points="44,14 52,18 48,20 44,18" fill="#b0b0b0" opacity="0.6"/>
</svg>
