<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0f;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#1a2e1f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1e10;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c41e1e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c41e1e;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky gradient -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#d4af37" opacity="0.8"/>
  <circle cx="340" cy="150" r="1" fill="#d4af37" opacity="0.6"/>
  <circle cx="560" cy="60" r="2" fill="#d4af37" opacity="0.9"/>
  <circle cx="780" cy="120" r="1.5" fill="#d4af37" opacity="0.7"/>
  <circle cx="1000" cy="45" r="1" fill="#d4af37" opacity="0.5"/>
  <circle cx="1220" cy="90" r="2" fill="#d4af37" opacity="0.8"/>
  <circle cx="1440" cy="70" r="1.5" fill="#d4af37" opacity="0.6"/>
  <circle cx="1660" cy="130" r="1" fill="#d4af37" opacity="0.7"/>
  <circle cx="1800" cy="55" r="2" fill="#d4af37" opacity="0.9"/>
  <circle cx="200" cy="200" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="600" cy="180" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="1100" cy="160" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="1500" cy="200" r="1.5" fill="#ffffff" opacity="0.4"/>

  <!-- Radar sweep arcs -->
  <circle cx="960" cy="540" r="400" fill="none" stroke="#c41e1e" stroke-width="1" opacity="0.15"/>
  <circle cx="960" cy="540" r="280" fill="none" stroke="#c41e1e" stroke-width="1" opacity="0.12"/>
  <circle cx="960" cy="540" r="160" fill="none" stroke="#c41e1e" stroke-width="1" opacity="0.1"/>

  <!-- Radar crosshairs -->
  <line x1="960" y1="140" x2="960" y2="940" stroke="#c41e1e" stroke-width="1" opacity="0.2"/>
  <line x1="560" y1="540" x2="1360" y2="540" stroke="#c41e1e" stroke-width="1" opacity="0.2"/>

  <!-- Ground / horizon -->
  <rect x="0" y="820" width="1920" height="260" fill="#0d1a0f" opacity="0.8"/>

  <!-- Silhouette mountains -->
  <polygon points="0,820 200,680 400,760 600,640 800,720 960,600 1120,720 1320,640 1520,760 1720,680 1920,820" fill="#0a1507"/>

  <!-- S300 launcher silhouette (center) -->
  <g transform="translate(880,640)" fill="#b0b0b0" opacity="0.9" filter="url(#glow)">
    <!-- Vehicle body -->
    <rect x="0" y="80" width="200" height="50" rx="4" fill="#1a2a1a"/>
    <rect x="20" y="90" width="160" height="35" rx="3" fill="#2a3a2a"/>
    <!-- Turret -->
    <rect x="60" y="50" width="80" height="40" rx="3" fill="#1a2a1a"/>
    <!-- Missile tubes -->
    <rect x="30" y="20" width="20" height="60" rx="2" fill="#c41e1e" opacity="0.8"/>
    <rect x="60" y="10" width="20" height="70" rx="2" fill="#c41e1e" opacity="0.9"/>
    <rect x="90" y="5" width="20" height="75" rx="2" fill="#c41e1e" opacity="0.95"/>
    <rect x="120" y="10" width="20" height="70" rx="2" fill="#c41e1e" opacity="0.9"/>
    <rect x="150" y="20" width="20" height="60" rx="2" fill="#c41e1e" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="30" cy="135" r="15" fill="#0a0a0a"/>
    <circle cx="80" cy="135" r="15" fill="#0a0a0a"/>
    <circle cx="130" cy="135" r="15" fill="#0a0a0a"/>
    <circle cx="180" cy="135" r="15" fill="#0a0a0a"/>
  </g>

  <!-- Missile trail (red glow) -->
  <line x1="980" y1="620" x2="700" y2="200" stroke="#c41e1e" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
  <line x1="980" y1="620" x2="700" y2="200" stroke="#ff4444" stroke-width="1" opacity="0.9"/>
  <circle cx="700" cy="200" r="8" fill="#ff4444" opacity="0.9" filter="url(#glow)"/>

  <!-- Title overlay -->
  <text x="960" y="920" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="#d4af37" filter="url(#glow)" letter-spacing="12">LE MILITARE</text>
  <text x="960" y="970" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#b0b0b0" letter-spacing="6">CLUSTER STRIKE · AIR DEFENSE ENGAGED</text>
</svg>
