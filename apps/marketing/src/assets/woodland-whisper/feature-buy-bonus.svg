<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bb-glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bb-bolt" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <!-- Hexagon border -->
  <polygon
    points="32,3 57,17 57,47 32,61 7,47 7,17"
    fill="none"
    stroke="#d4a017"
    stroke-width="1.5"
    opacity="0.5"
  />
  <!-- Inner hex (dimmer) -->
  <polygon
    points="32,10 50,20.5 50,43.5 32,54 14,43.5 14,20.5"
    fill="#0d1f08"
    stroke="#d4a017"
    stroke-width="1"
    opacity="0.3"
  />
  <!-- Lightning bolt -->
  <polygon
    points="37,10 22,36 32,36 26,54 44,28 33,28 39,10"
    fill="url(#bb-bolt)"
    filter="url(#bb-glow)"
  />
</svg>
