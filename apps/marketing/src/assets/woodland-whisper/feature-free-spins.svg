<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fs-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="fs-coin" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="60%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#6b4600"/>
    </radialGradient>
  </defs>
  <!-- Outer sparkle points -->
  <g fill="#d4a017" filter="url(#fs-glow)">
    <circle cx="32" cy="6"  r="2"   opacity="0.9"/>
    <circle cx="52" cy="16" r="1.5" opacity="0.7"/>
    <circle cx="56" cy="38" r="1.5" opacity="0.6"/>
    <circle cx="44" cy="56" r="1.5" opacity="0.6"/>
    <circle cx="20" cy="56" r="1.5" opacity="0.6"/>
    <circle cx="8"  cy="38" r="1.5" opacity="0.6"/>
    <circle cx="12" cy="16" r="1.5" opacity="0.7"/>
  </g>
  <!-- Orbit ring (represents spinning) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#d4a017" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <!-- Coin body -->
  <circle cx="32" cy="32" r="17" fill="url(#fs-coin)" filter="url(#fs-glow)"/>
  <!-- Coin rim highlight -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ffe066" stroke-width="1.5" opacity="0.8"/>
  <!-- Inner groove -->
  <circle cx="32" cy="32" r="13" fill="none" stroke="#8b6010" stroke-width="1" opacity="0.5"/>
  <!-- "2×" label -->
  <text x="32" y="38" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="13" fill="#060e04">2×</text>
</svg>
