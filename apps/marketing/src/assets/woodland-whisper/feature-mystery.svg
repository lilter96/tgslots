<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="my-glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="my-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Soft inner glow fill -->
  <circle cx="32" cy="32" r="24" fill="url(#my-core)"/>
  <!-- Outer dashed rune ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.6"/>
  <!-- Inner solid ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.4"/>
  <!-- Cardinal tick marks -->
  <g stroke="#d4a017" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="32" y1="3"  x2="32" y2="10"/>
    <line x1="32" y1="54" x2="32" y2="61"/>
    <line x1="3"  y1="32" x2="10" y2="32"/>
    <line x1="54" y1="32" x2="61" y2="32"/>
  </g>
  <!-- Diagonal marks -->
  <g stroke="#d4a017" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <line x1="11" y1="11" x2="16" y2="16"/>
    <line x1="53" y1="11" x2="48" y2="16"/>
    <line x1="11" y1="53" x2="16" y2="48"/>
    <line x1="53" y1="53" x2="48" y2="48"/>
  </g>
  <!-- Central ✦ glyph -->
  <text
    x="32" y="39"
    text-anchor="middle"
    font-family="Cinzel, Georgia, serif"
    font-size="22"
    fill="#ffe066"
    filter="url(#my-glow)"
    opacity="0.95"
  >✦</text>
</svg>
