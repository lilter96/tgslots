<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="d-sky" cx="50%" cy="35%" r="80%">
      <stop offset="0%"   stop-color="#3a5020"/>
      <stop offset="40%"  stop-color="#1a2a10"/>
      <stop offset="100%" stop-color="#050a05"/>
    </radialGradient>
    <radialGradient id="d-altar" cx="50%" cy="50%" r="32%">
      <stop offset="0%"   stop-color="#ffe066" stop-opacity="0.55"/>
      <stop offset="25%"  stop-color="#ff9d00" stop-opacity="0.30"/>
      <stop offset="65%"  stop-color="#aa5500" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-ray" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#ffe066" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#ffe066" stop-opacity="0.18"/>
      <stop offset="80%"  stop-color="#ff9d00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff9d00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d1f08"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <radialGradient id="d-mist" cx="50%" cy="60%" r="70%">
      <stop offset="0%"   stop-color="#a8c890" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a8c890" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-vt" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-vb" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="d-vl" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-vr" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="d-blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="d-blur-soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="d-glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="d-strong-glow">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="d-bark" width="10" height="60" patternUnits="userSpaceOnUse">
      <rect width="10" height="60" fill="#2a1a0a"/>
      <path d="M0,8 Q5,22 0,36 Q5,50 0,60" stroke="#1a0d05" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#d-sky)"/>

  <!-- Deep distance horizon -->
  <g filter="url(#d-blur)" opacity="0.5">
    <rect x="0"    y="500" width="1920" height="280" fill="#0a1f0a"/>
    <ellipse cx="200"  cy="500" rx="200" ry="70" fill="#0d2a0d"/>
    <ellipse cx="560"  cy="490" rx="220" ry="75" fill="#0d2a0d"/>
    <ellipse cx="960"  cy="495" rx="200" ry="70" fill="#0d2a0d"/>
    <ellipse cx="1360" cy="490" rx="220" ry="75" fill="#0d2a0d"/>
    <ellipse cx="1720" cy="500" rx="200" ry="70" fill="#0d2a0d"/>
  </g>

  <!-- Mid trees -->
  <g filter="url(#d-blur-soft)" opacity="0.75">
    <g fill="#1a0d05">
      <rect x="80"   y="440" width="13" height="280"/>
      <rect x="240"  y="430" width="15" height="300"/>
      <rect x="380"  y="445" width="11" height="270"/>
      <rect x="520"  y="438" width="14" height="285"/>
      <rect x="660"  y="445" width="11" height="270"/>
      <rect x="1260" y="438" width="14" height="285"/>
      <rect x="1400" y="445" width="11" height="270"/>
      <rect x="1540" y="430" width="15" height="300"/>
      <rect x="1680" y="445" width="11" height="270"/>
      <rect x="1820" y="438" width="13" height="280"/>
    </g>
    <g fill="#1a3a0a">
      <ellipse cx="86"   cy="440" rx="32" ry="22"/>
      <ellipse cx="247"  cy="430" rx="38" ry="26"/>
      <ellipse cx="385"  cy="445" rx="30" ry="20"/>
      <ellipse cx="527"  cy="438" rx="36" ry="24"/>
      <ellipse cx="665"  cy="445" rx="30" ry="20"/>
      <ellipse cx="1267" cy="438" rx="36" ry="24"/>
      <ellipse cx="1405" cy="445" rx="30" ry="20"/>
      <ellipse cx="1547" cy="430" rx="38" ry="26"/>
      <ellipse cx="1685" cy="445" rx="30" ry="20"/>
      <ellipse cx="1826" cy="438" rx="32" ry="22"/>
    </g>
  </g>

  <!-- God rays — wide cinematic spread -->
  <g opacity="0.85">
    <polygon points="780,0 815,0 920,720 880,720"   fill="url(#d-ray)" transform="rotate(-3,795,0)"/>
    <polygon points="870,0 895,0 980,720 950,720"   fill="url(#d-ray)" opacity="0.9"/>
    <polygon points="940,0 965,0 1030,720 1000,720" fill="url(#d-ray)"/>
    <polygon points="1010,0 1035,0 1090,720 1060,720" fill="url(#d-ray)" opacity="0.85"/>
    <polygon points="1080,0 1105,0 1160,720 1130,720" fill="url(#d-ray)" transform="rotate(3,1090,0)" opacity="0.75"/>
    <polygon points="1170,0 1190,0 1240,680 1215,680" fill="url(#d-ray)" transform="rotate(5,1175,0)" opacity="0.65"/>
    <polygon points="660,0 678,0 740,650 710,650"     fill="url(#d-ray)" transform="rotate(-7,665,0)"  opacity="0.55"/>
    <polygon points="540,0 555,0 620,620 595,620"     fill="url(#d-ray)" transform="rotate(-10,545,0)" opacity="0.45"/>
    <polygon points="1290,0 1305,0 1360,620 1335,620" fill="url(#d-ray)" transform="rotate(8,1295,0)"  opacity="0.45"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="960" cy="480" rx="640" ry="420" fill="url(#d-altar)"/>

  <!-- Ancient tree centerpiece -->
  <g>
    <!-- Trunk -->
    <path d="M960,750 Q908,670 915,560 Q924,440 910,340 Q900,250 906,180 L1014,180 Q1020,250 1010,340 Q996,440 1005,560 Q1012,670 960,750Z" fill="#2a1a0a"/>
    <path d="M960,750 Q908,670 915,560 Q924,440 910,340 Q900,250 906,180 L1014,180 Q1020,250 1010,340 Q996,440 1005,560 Q1012,670 960,750Z" fill="url(#d-bark)" opacity="0.5"/>
    <!-- Trunk highlight -->
    <path d="M915,560 Q912,500 916,440 Q918,380 914,320 Q912,250 916,200" stroke="#3a2510" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Roots -->
    <path d="M960,745 Q860,775 740,800 Q650,816 560,824 L560,840 Q670,836 770,818 Q900,790 960,745Z" fill="#1a0d05"/>
    <path d="M960,745 Q1060,775 1180,800 Q1270,816 1360,824 L1360,840 Q1250,836 1150,818 Q1020,790 960,745Z" fill="#1a0d05"/>
    <!-- Branches -->
    <path d="M912,330 Q820,290 730,275 Q650,265 580,275"    stroke="#2a1a0a" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M1008,330 Q1100,290 1190,275 Q1270,265 1340,275" stroke="#2a1a0a" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M912,240 Q855,200 815,165 Q785,135 765,118"    stroke="#2a1a0a" stroke-width="7"  fill="none" stroke-linecap="round"/>
    <path d="M1008,240 Q1065,200 1105,165 Q1135,135 1155,118" stroke="#2a1a0a" stroke-width="7"  fill="none" stroke-linecap="round"/>
    <path d="M730,275 Q695,240 670,210"  stroke="#2a1a0a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M1190,275 Q1225,240 1250,210" stroke="#2a1a0a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Glowing hollow -->
    <ellipse cx="960" cy="500" rx="42" ry="62" fill="#050a05"/>
    <ellipse cx="960" cy="500" rx="34" ry="54" fill="url(#d-altar)" filter="url(#d-strong-glow)"/>
    <circle  cx="960" cy="500" r="14"  fill="#ffe066" filter="url(#d-glow)"/>
    <circle  cx="960" cy="500" r="6"   fill="#fff"/>
    <!-- Runes -->
