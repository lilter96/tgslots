      <path d="M150,160 Q148,210 158,260 Q152,300 162,340"/>
      <path d="M350,170 Q348,220 358,270 Q352,310 362,350"/>
      <path d="M450,175 Q452,225 442,275"/>
      <path d="M900,170 Q902,220 892,270 Q898,310 888,350"/>
      <path d="M1000,160 Q998,210 1008,260"/>
      <path d="M1200,170 Q1202,220 1192,270 Q1198,310 1188,350"/>
    </g>
    <g fill="#2a6a2a" opacity="0.8">
      <ellipse cx="155"  cy="245" rx="4" ry="7"/>
      <ellipse cx="355"  cy="255" rx="4" ry="7"/>
      <ellipse cx="895"  cy="255" rx="4" ry="7"/>
      <ellipse cx="1195" cy="255" rx="4" ry="7"/>
    </g>
  </g>

  <!-- Mist mid-layer -->
