    <ellipse cx="0" cy="38" rx="26" ry="6" fill="#000" opacity="0.5"/>
    <rect x="-9" y="10" width="18" height="32" rx="5" fill="#e8d4b0"/>
    <ellipse cx="0" cy="10" rx="34" ry="22" fill="#cc3344"/>
    <ellipse cx="0" cy="9"  rx="34" ry="20" fill="#dd4455"/>
    <circle cx="-12" cy="6"  r="4.5" fill="#fff" opacity="0.85"/>
    <circle cx="10"  cy="11" r="4"   fill="#fff" opacity="0.85"/>
    <circle cx="0"   cy="-3" r="3"   fill="#fff" opacity="0.85"/>
    <circle cx="18"  cy="3"  r="3"   fill="#fff" opacity="0.85"/>
