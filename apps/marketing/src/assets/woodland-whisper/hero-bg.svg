  <!-- Falling leaves -->
  <g opacity="0.75">
    <ellipse cx="200"  cy="220" rx="11" ry="5"   fill="#cc7722" transform="rotate(25,-200,220)"/>
    <ellipse cx="1620" cy="280" rx="10" ry="5"   fill="#dd8833" transform="rotate(-40,1620,280)"/>
    <ellipse cx="100"  cy="540" rx="11" ry="5"   fill="#aa6622" transform="rotate(60,100,540)"/>
    <ellipse cx="1800" cy="570" rx="10" ry="5"   fill="#cc7722" transform="rotate(-20,1800,570)"/>
    <ellipse cx="500"  cy="170" rx="9"  ry="4.5" fill="#dd8833" transform="rotate(35,500,170)"/>
    <ellipse cx="1320" cy="200" rx="10" ry="5"   fill="#cc7722" transform="rotate(-30,1320,200)"/>
    <ellipse cx="700"  cy="660" rx="9"  ry="4.5" fill="#cc7722" transform="rotate(50,700,660)"/>
    <ellipse cx="1240" cy="680" rx="10" ry="5"   fill="#aa6622" transform="rotate(-15,1240,680)"/>
