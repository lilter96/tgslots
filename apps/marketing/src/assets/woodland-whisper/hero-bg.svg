    <ellipse cx="960" cy="980" rx="240" ry="26" fill="#3a3025"/>
    <ellipse cx="960" cy="920" rx="180" ry="22" fill="#3a3025"/>
    <ellipse cx="960" cy="870" rx="130" ry="18" fill="#3a3025"/>
    <ellipse cx="960" cy="830" rx="80"  ry="12" fill="#3a3025"/>
    <ellipse cx="900" cy="950" rx="50"  ry="14" fill="#4a4035" opacity="0.7"/>
    <ellipse cx="1020" cy="950" rx="50" ry="14" fill="#4a4035" opacity="0.7"/>
  </g>

  <!-- Mushroom cluster left -->
