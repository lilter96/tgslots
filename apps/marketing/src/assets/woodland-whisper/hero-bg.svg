    <path d="M1940,1080 Q1880,900 1890,720 Q1896,560 1870,420 Q1860,320 1870,200 Q1880,100 1920,0 L2020,0Z" fill="#0a1505"/>
    <path d="M1930,300 Q1830,260 1700,250 Q1590,250 1510,275 Q1450,285 1400,310" stroke="#0a1505" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M1870,250 Q1780,210 1680,200 Q1600,205 1540,225"              stroke="#0a1505" stroke-width="22" fill="none" stroke-linecap="round"/>
    <g fill="#1a3520" opacity="0.85">
      <ellipse cx="1840" cy="245" rx="40" ry="25"/>
      <ellipse cx="1740" cy="218" rx="50" ry="30"/>
      <ellipse cx="1640" cy="208" rx="45" ry="28"/>
      <ellipse cx="1540" cy="218" rx="40" ry="25"/>
    </g>
  </g>

