      <text x="960" y="640" text-anchor="middle">✦</text>
      <text x="925" y="565" text-anchor="middle">⟁</text>
      <text x="996" y="565" text-anchor="middle">⟁</text>
      <text x="925" y="430" text-anchor="middle">◈</text>
      <text x="996" y="430" text-anchor="middle">◈</text>
    </g>
