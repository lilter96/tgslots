    <g opacity="0.85" fill="#0d2010">
      <ellipse cx="100"  cy="110" rx="110" ry="65"/>
      <ellipse cx="320"  cy="90"  rx="120" ry="65"/>
      <ellipse cx="560"  cy="105" rx="130" ry="70"/>
      <ellipse cx="800"  cy="90"  rx="120" ry="65"/>
      <ellipse cx="1060" cy="100" rx="125" ry="68"/>
      <ellipse cx="1300" cy="90"  rx="125" ry="65"/>
      <ellipse cx="1540" cy="105" rx="125" ry="68"/>
      <ellipse cx="1760" cy="90"  rx="120" ry="65"/>
