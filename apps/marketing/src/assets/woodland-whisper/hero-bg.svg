    <ellipse cx="0" cy="10" rx="22" ry="14" fill="#cc3344"/>
    <circle cx="-7" cy="7" r="2.5" fill="#fff" opacity="0.85"/>
    <circle cx="7"  cy="10" r="2.5" fill="#fff" opacity="0.85"/>
  </g>

  <!-- Mushroom cluster right -->
  <g transform="translate(1640,900)">
    <ellipse cx="0" cy="38" rx="26" ry="6" fill="#000" opacity="0.5"/>
