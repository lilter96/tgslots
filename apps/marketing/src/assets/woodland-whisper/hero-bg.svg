    <path d="M80,920 L78,888 M92,922 L94,886 M104,920 L102,892"/>
    <path d="M460,895 L458,862 M472,897 L474,860 M484,895 L482,866"/>
    <path d="M620,870 L618,840 M632,872 L634,838 M644,870 L642,842"/>
    <path d="M1280,870 L1278,840 M1292,872 L1294,838 M1304,870 L1302,842"/>
    <path d="M1440,895 L1438,862 M1452,897 L1454,860 M1464,895 L1462,866"/>
    <path d="M1820,920 L1818,888 M1832,922 L1834,886 M1844,920 L1842,892"/>
  </g>
  <g>
    <circle cx="92"   cy="882" r="6" fill="#ff6b9d"/><circle cx="92"   cy="882" r="2.8" fill="#ffe066"/>
    <circle cx="472"  cy="855" r="6" fill="#cc88ff"/><circle cx="472"  cy="855" r="2.8" fill="#ffe066"/>
    <circle cx="632"  cy="833" r="6" fill="#ffaa44"/><circle cx="632"  cy="833" r="2.5" fill="#fff"/>
    <circle cx="680"  cy="855" r="5" fill="#88ddff"/><circle cx="680"  cy="855" r="2.3" fill="#ffe066"/>
    <circle cx="1292" cy="833" r="6" fill="#88ddff"/><circle cx="1292" cy="833" r="2.8" fill="#ffe066"/>
    <circle cx="1240" cy="855" r="5" fill="#ffaa44"/><circle cx="1240" cy="855" r="2.3" fill="#fff"/>
    <circle cx="1452" cy="855" r="6" fill="#ff6b9d"/><circle cx="1452" cy="855" r="2.8" fill="#ffe066"/>
    <circle cx="1832" cy="882" r="6" fill="#cc88ff"/><circle cx="1832" cy="882" r="2.8" fill="#ffe066"/>
  </g>

  <!-- Magical particles -->
  <g filter="url(#d-glow)">
    <circle cx="280"  cy="380" r="3.5" fill="#ffe066" opacity="0.92"/>
    <circle cx="420"  cy="460" r="3"   fill="#aaff88" opacity="0.85"/>
    <circle cx="560"  cy="380" r="3.5" fill="#ffe066" opacity="0.9"/>
    <circle cx="680"  cy="520" r="3"   fill="#aaff88" opacity="0.85"/>
    <circle cx="760"  cy="360" r="2.5" fill="#ffe066" opacity="0.85"/>
    <circle cx="1160" cy="360" r="2.5" fill="#ffe066" opacity="0.85"/>
    <circle cx="1240" cy="520" r="3"   fill="#aaff88" opacity="0.85"/>
    <circle cx="1360" cy="380" r="3.5" fill="#ffe066" opacity="0.92"/>
    <circle cx="1500" cy="460" r="3"   fill="#aaff88" opacity="0.85"/>
    <circle cx="1640" cy="380" r="3.5" fill="#ffe066" opacity="0.9"/>
    <circle cx="200"  cy="600" r="3"   fill="#ffe066" opacity="0.85"/>
    <circle cx="500"  cy="650" r="2.5" fill="#aaff88" opacity="0.8"/>
    <circle cx="1420" cy="650" r="2.5" fill="#aaff88" opacity="0.8"/>
    <circle cx="1720" cy="600" r="3"   fill="#ffe066" opacity="0.85"/>
    <circle cx="860"  cy="350" r="2.2" fill="#ffe066" opacity="0.75"/>
    <circle cx="1060" cy="350" r="2.2" fill="#aaff88" opacity="0.75"/>
    <circle cx="900"  cy="680" r="2.8" fill="#ffe066" opacity="0.85"/>
    <circle cx="1020" cy="680" r="2.8" fill="#aaff88" opacity="0.85"/>
