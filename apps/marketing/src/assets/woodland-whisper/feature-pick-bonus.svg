<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pb-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Back card (rotated left, darker) -->
  <g transform="rotate(-14,32,32)">
    <rect x="14" y="16" width="22" height="32" rx="3" fill="#0d1f08" stroke="#d4a017" stroke-width="1.5"/>
    <text x="25" y="28" text-anchor="middle" font-family="serif" font-size="11" fill="#d4a017" opacity="0.8">?</text>
    <text x="25" y="42" text-anchor="middle" font-family="serif" font-size="8" fill="#d4a017" opacity="0.5">✦</text>
  </g>
  <!-- Front card (rotated right, brighter) -->
  <g transform="rotate(10,32,32)">
    <rect x="26" y="12" width="22" height="32" rx="3" fill="#0d1f08" stroke="#ffe066" stroke-width="1.5" filter="url(#pb-glow)"/>
    <!-- Card suit: coin -->
    <circle cx="37" cy="23" r="4.5" fill="none" stroke="#ffe066" stroke-width="1.2"/>
    <circle cx="37" cy="23" r="2"   fill="#ffe066" opacity="0.9"/>
    <line x1="37" y1="30" x2="37" y2="36" stroke="#d4a017" stroke-width="1" opacity="0.7"/>
    <circle cx="37" cy="39" r="3.5" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Soft glow halo -->
  <circle cx="34" cy="32" r="14" fill="#ffe066" opacity="0.05" filter="url(#pb-glow)"/>
</svg>
