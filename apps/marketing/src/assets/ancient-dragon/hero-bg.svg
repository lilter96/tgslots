<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ad-sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#3a0505"/>
      <stop offset="35%"  stop-color="#1a0202"/>
      <stop offset="100%" stop-color="#0d0000"/>
    </radialGradient>
    <radialGradient id="ad-glow" cx="50%" cy="42%" r="32%">
      <stop offset="0%"   stop-color="#cc1a1a" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#8b0000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ad-gold-orb" cx="50%" cy="48%" r="28%">
      <stop offset="0%"   stop-color="#d4a017" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="#cc1a1a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ad-ray" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#cc1a1a" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#cc1a1a" stop-opacity="0.14"/>
      <stop offset="75%"  stop-color="#8b0000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ad-ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#060000"/>
    </linearGradient>
    <linearGradient id="ad-pillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2a0505"/>
      <stop offset="30%"  stop-color="#4a1010"/>
      <stop offset="70%"  stop-color="#3a0808"/>
      <stop offset="100%" stop-color="#1a0202"/>
    </linearGradient>
    <linearGradient id="ad-roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3a0a0a"/>
      <stop offset="100%" stop-color="#1a0404"/>
    </linearGradient>
    <linearGradient id="ad-vt" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ad-vb" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ad-vl" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ad-vr" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="ad-blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="ad-blur-soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="ad-glow-f">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ad-strong-glow">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ad-lantern-glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#ad-sky)"/>

  <!-- Atmospheric glow layers -->
  <ellipse cx="960" cy="460" rx="700" ry="500" fill="url(#ad-glow)"/>
  <ellipse cx="960" cy="500" rx="460" ry="340" fill="url(#ad-gold-orb)"/>

  <!-- God rays -->
  <g opacity="0.7">
    <polygon points="800,0 835,0 940,680 900,680"   fill="url(#ad-ray)" transform="rotate(-3,815,0)"/>
    <polygon points="880,0 908,0 990,680 958,680"   fill="url(#ad-ray)" opacity="0.85"/>
    <polygon points="950,0 978,0 1048,680 1018,680" fill="url(#ad-ray)"/>
    <polygon points="1020,0 1048,0 1108,680 1078,680" fill="url(#ad-ray)" opacity="0.8"/>
    <polygon points="1095,0 1120,0 1170,650 1144,650" fill="url(#ad-ray)" transform="rotate(3,1105,0)" opacity="0.65"/>
    <polygon points="1185,0 1205,0 1252,620 1228,620" fill="url(#ad-ray)" transform="rotate(6,1190,0)" opacity="0.5"/>
    <polygon points="680,0 698,0 758,620 732,620"     fill="url(#ad-ray)" transform="rotate(-6,686,0)"  opacity="0.5"/>
  </g>

  <!-- Distant mountains / silhouettes -->
  <g filter="url(#ad-blur)" opacity="0.45">
    <path d="M0,600 Q200,480 400,520 Q600,480 700,540 Q800,490 960,500 Q1120,490 1220,540 Q1320,480 1520,520 Q1720,480 1920,600 L1920,700 L0,700Z" fill="#1a0404"/>
  </g>

  <!-- Temple gate (torii-style) -->
  <g>
    <!-- Main crossbeam top -->
    <rect x="610" y="215" width="700" height="32" rx="4" fill="url(#ad-roof)"/>
    <rect x="595" y="248" width="730" height="18" rx="3" fill="#3a0808"/>
    <!-- Crossbeam ends droop -->
    <path d="M595,230 Q570,235 580,250 L595,248Z" fill="#2a0606"/>
    <path d="M1325,230 Q1350,235 1340,250 L1325,248Z" fill="#2a0606"/>
    <!-- Secondary crossbeam -->
    <rect x="640" y="295" width="640" height="22" rx="3" fill="#2a0808"/>
    <!-- Left pillar -->
    <rect x="640" y="265" width="60" height="600" rx="6" fill="url(#ad-pillar)"/>
    <rect x="644" y="265" width="8" height="600" rx="3" fill="#5a1515" opacity="0.6"/>
    <!-- Right pillar -->
    <rect x="1220" y="265" width="60" height="600" rx="6" fill="url(#ad-pillar)"/>
    <rect x="1268" y="265" width="8" height="600" rx="3" fill="#5a1515" opacity="0.6"/>
    <!-- Gold trim on pillars -->
    <rect x="638" y="265" width="64" height="6" rx="2" fill="#d4a017" opacity="0.8"/>
    <rect x="638" y="860" width="64" height="6" rx="2" fill="#d4a017" opacity="0.8"/>
    <rect x="1218" y="265" width="64" height="6" rx="2" fill="#d4a017" opacity="0.8"/>
    <rect x="1218" y="860" width="64" height="6" rx="2" fill="#d4a017" opacity="0.8"/>
    <!-- Dragon carvings on pillars (simplified) -->
    <g fill="#d4a017" opacity="0.35" filter="url(#ad-glow-f)">
      <path d="M650,380 Q660,370 670,375 Q680,380 670,390 Q660,395 650,390Z"/>
      <path d="M650,420 Q662,408 672,415 Q680,422 672,432 Q662,438 650,432Z"/>
      <path d="M650,460 Q660,452 670,457 Q678,463 670,472 Q660,477 650,472Z"/>
      <path d="M1230,380 Q1240,370 1250,375 Q1260,380 1250,390 Q1240,395 1230,390Z"/>
      <path d="M1230,420 Q1242,408 1252,415 Q1260,422 1252,432 Q1242,438 1230,432Z"/>
      <path d="M1230,460 Q1240,452 1250,457 Q1258,463 1250,472 Q1240,477 1230,472Z"/>
    </g>
    <!-- Roof curve top -->
    <path d="M580,200 Q700,170 960,160 Q1220,170 1340,200 L1325,215 Q1200,195 960,188 Q720,195 595,215Z" fill="#2a0808"/>
    <!-- Roof ridge ornament -->
    <path d="M920,155 Q960,130 1000,155" stroke="#d4a017" stroke-width="3" fill="none" opacity="0.7"/>
    <circle cx="960" cy="145" r="8" fill="#d4a017" opacity="0.8" filter="url(#ad-glow-f)"/>
  </g>

  <!-- Inner temple arch / door -->
  <g>
    <rect x="880" y="460" width="200" height="400" rx="8" fill="#0d0000" opacity="0.9"/>
    <path d="M878,462 Q960,400 1082,462" fill="#140404"/>
    <ellipse cx="960" cy="510" rx="80" ry="60" fill="#1a0505" opacity="0.8"/>
    <!-- Door glow -->
    <ellipse cx="960" cy="530" rx="60" ry="80" fill="#cc1a1a" opacity="0.12" filter="url(#ad-strong-glow)"/>
    <circle  cx="960" cy="480" r="18" fill="#d4a017" opacity="0.5" filter="url(#ad-strong-glow)"/>
    <!-- Yin-Yang symbol in glow -->
    <circle cx="960" cy="480" r="22" fill="none" stroke="#d4a017" stroke-width="1.5" opacity="0.6"/>
    <text x="960" y="488" text-anchor="middle" font-family="serif" font-size="24" fill="#d4a017" opacity="0.7" filter="url(#ad-glow-f)">☯</text>
  </g>

  <!-- Left secondary temple structure -->
  <g filter="url(#ad-blur-soft)" opacity="0.75">
    <rect x="160" y="420" width="30" height="480" rx="4" fill="#2a0606"/>
    <rect x="280" y="440" width="30" height="460" rx="4" fill="#2a0606"/>
    <path d="M130,415 Q195,385 340,415" fill="#1a0404" stroke="#2a0808" stroke-width="2"/>
    <path d="M130,400 Q195,375 340,400 L340,416 Q195,400 130,415Z" fill="#3a0808"/>
    <rect x="100" y="396" width="270" height="22" rx="3" fill="#2a0808"/>
  </g>

  <!-- Right secondary temple structure -->
  <g filter="url(#ad-blur-soft)" opacity="0.75">
    <rect x="1610" y="420" width="30" height="480" rx="4" fill="#2a0606"/>
    <rect x="1490" y="440" width="30" height="460" rx="4" fill="#2a0606"/>
    <path d="M1580,415 Q1645,385 1790,415" fill="#1a0404" stroke="#2a0808" stroke-width="2"/>
    <path d="M1580,400 Q1645,375 1790,400 L1790,416 Q1645,400 1580,415Z" fill="#3a0808"/>
    <rect x="1580" y="396" width="240" height="22" rx="3" fill="#2a0808"/>
  </g>

  <!-- Hanging lanterns — left cluster -->
  <g filter="url(#ad-lantern-glow)">
    <line x1="240" y1="0" x2="240" y2="120" stroke="#4a1a1a" stroke-width="2"/>
    <ellipse cx="240" cy="148" rx="20" ry="30" fill="#cc1a1a" opacity="0.92"/>
    <ellipse cx="240" cy="140" rx="20" ry="8"  fill="#ff4444" opacity="0.7"/>
    <ellipse cx="240" cy="175" rx="20" ry="8"  fill="#aa1111" opacity="0.6"/>
    <ellipse cx="240" cy="148" rx="14" ry="22" fill="#ff4444" opacity="0.3"/>
    <circle  cx="240" cy="148" r="8"  fill="#ffe066" opacity="0.5"/>
    <g fill="#ffe066" opacity="0.6">
      <rect x="234" y="178" width="1.5" height="12"/>
      <rect x="238" y="178" width="1.5" height="14"/>
      <rect x="242" y="178" width="1.5" height="12"/>
      <rect x="246" y="178" width="1.5" height="10"/>
    </g>
  </g>
  <g filter="url(#ad-lantern-glow)">
    <line x1="380" y1="0" x2="380" y2="90" stroke="#4a1a1a" stroke-width="2"/>
    <ellipse cx="380" cy="118" rx="16" ry="24" fill="#cc1a1a" opacity="0.88"/>
    <ellipse cx="380" cy="110" rx="16" ry="6"  fill="#ff4444" opacity="0.7"/>
    <ellipse cx="380" cy="140" rx="16" ry="6"  fill="#aa1111" opacity="0.6"/>
    <circle  cx="380" cy="118" r="6"  fill="#ffe066" opacity="0.4"/>
    <g fill="#ffe066" opacity="0.5">
      <rect x="374" y="144" width="1.5" height="10"/>
      <rect x="378" y="144" width="1.5" height="12"/>
      <rect x="382" y="144" width="1.5" height="10"/>
    </g>
  </g>

  <!-- Hanging lanterns — center pair (flanking gate) -->
  <g filter="url(#ad-lantern-glow)">
    <line x1="720" y1="266" x2="720" y2="336" stroke="#4a1a1a" stroke-width="2"/>
    <ellipse cx="720" cy="364" rx="22" ry="32" fill="#cc1a1a" opacity="0.95"/>
    <ellipse cx="720" cy="355" rx="22" ry="9"  fill="#ff4444" opacity="0.75"/>
    <ellipse cx="720" cy="394" rx="22" ry="9"  fill="#aa1111" opacity="0.65"/>
    <ellipse cx="720" cy="364" rx="15" ry="24" fill="#ff5555" opacity="0.3"/>
    <circle  cx="720" cy="364" r="10" fill="#ffe066" opacity="0.55"/>
    <g fill="#ffe066" opacity="0.65">
      <rect x="713" y="396" width="2" height="14"/>
      <rect x="718" y="396" width="2" height="16"/>
      <rect x="723" y="396" width="2" height="14"/>
      <rect x="728" y="396" width="2" height="12"/>
    </g>
  </g>
  <g filter="url(#ad-lantern-glow)">
    <line x1="1200" y1="266" x2="1200" y2="336" stroke="#4a1a1a" stroke-width="2"/>
    <ellipse cx="1200" cy="364" rx="22" ry="32" fill="#cc1a1a" opacity="0.95"/>
    <ellipse cx="1200" cy="355" rx="22" ry="9"  fill="#ff4444" opacity="0.75"/>
    <ellipse cx="1200" cy="394" rx="22" ry="9"  fill="#aa1111" opacity="0.65"/>
    <ellipse cx="1200" cy="364" rx="15" ry="24" fill="#ff5555" opacity="0.3"/>
    <circle  cx="1200" cy="364" r="10" fill="#ffe066" opacity="0.55"/>
    <g fill="#ffe066" opacity="0.65">
      <rect x="1193" y="396" width="2" height="14"/>
      <rect x="1198" y="396" width="2" height="16"/>
      <rect x="1203" y="396" width="2" height="14"/>
      <rect x="1208" y="396" width="2" height="12"/>
    </g>
  </g>

  <!-- Hanging lanterns — right cluster -->
  <g filter="url(#ad-lantern-glow)">
    <line x1="1540" y1="0" x2="1540" y2="90" stroke="#4a1a1a" stroke-width="2"/>
    <ellipse cx="1540" cy="118" rx="16" ry="24" fill="#cc1a1a" opacity="0.88"/>
    <ellipse cx="1540" cy="110" rx="16" ry="6"  fill="#ff4444" opacity="0.7"/>
    <ellipse cx="1540" cy="140" rx="16" ry="6"  fill="#aa1111" opacity="0.6"/>
    <circle  cx="1540" cy="118" r="6"  fill="#ffe066" opacity="0.4"/>
  </g>
  <g filter="url(#ad-lantern-glow)">
    <line x1="1680" y1="0" x2="1680" y2="120" stroke="#4a1a1a" stroke-width="2"/>
    <ellipse cx="1680" cy="148" rx="20" ry="30" fill="#cc1a1a" opacity="0.92"/>
    <ellipse cx="1680" cy="140" rx="20" ry="8"  fill="#ff4444" opacity="0.7"/>
    <ellipse cx="1680" cy="175" rx="20" ry="8"  fill="#aa1111" opacity="0.6"/>
    <circle  cx="1680" cy="148" r="8"  fill="#ffe066" opacity="0.5"/>
  </g>

  <!-- Dragon silhouette left -->
  <g opacity="0.28" filter="url(#ad-blur-soft)">
    <path d="M50,300 Q120,260 200,280 Q260,295 300,260 Q340,220 380,240 Q420,260 400,310 Q380,355 340,360 Q300,365 260,340 Q220,310 180,325 Q140,345 100,330 Q60,315 50,300Z" fill="#8b0000"/>
    <path d="M50,300 Q80,290 110,305" stroke="#cc1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M380,240 Q400,210 420,190 Q440,180 460,195" stroke="#8b0000" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M420,195 Q440,175 460,165 Q480,160 490,175" stroke="#8b0000" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Dragon silhouette right -->
  <g opacity="0.28" filter="url(#ad-blur-soft)">
    <path d="M1870,280 Q1800,240 1720,260 Q1660,275 1620,240 Q1580,205 1540,225 Q1500,245 1520,295 Q1540,340 1580,345 Q1620,350 1660,320 Q1700,295 1740,310 Q1780,330 1820,315 Q1860,300 1870,280Z" fill="#8b0000"/>
    <path d="M1870,280 Q1840,270 1810,285" stroke="#cc1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M1540,225 Q1520,198 1500,178 Q1480,165 1460,180" stroke="#8b0000" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Ground -->
  <path d="M0,840 Q380,812 960,815 Q1540,812 1920,840 L1920,1080 L0,1080Z" fill="url(#ad-ground)"/>
  <path d="M0,852 Q380,826 960,829 Q1540,826 1920,852" stroke="#4a1010" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- Stone path to temple -->
  <g opacity="0.55">
    <ellipse cx="960" cy="990" rx="280" ry="28" fill="#2a1a1a"/>
    <ellipse cx="960" cy="940" rx="210" ry="22" fill="#2a1a1a"/>
    <ellipse cx="960" cy="900" rx="155" ry="18" fill="#2a1a1a"/>
    <ellipse cx="960" cy="865" rx="100" ry="13" fill="#2a1a1a"/>
    <ellipse cx="880" cy="960" rx="55"  ry="13" fill="#351a1a" opacity="0.7"/>
    <ellipse cx="1040" cy="960" rx="55" ry="13" fill="#351a1a" opacity="0.7"/>
  </g>

  <!-- Stone steps leading up -->
  <g fill="#220a0a" opacity="0.7">
    <rect x="860" y="820" width="200" height="14" rx="2"/>
    <rect x="875" y="806" width="170" height="14" rx="2"/>
    <rect x="890" y="792" width="140" height="14" rx="2"/>
  </g>

  <!-- Gold rune markers on ground -->
  <g fill="#d4a017" opacity="0.5" font-family="serif" font-size="18" filter="url(#ad-glow-f)">
    <text x="820" y="862" text-anchor="middle">✦</text>
    <text x="1100" y="862" text-anchor="middle">✦</text>
    <text x="960" y="855" text-anchor="middle">◈</text>
  </g>

  <!-- Embers / sparks -->
  <g filter="url(#ad-glow-f)">
    <circle cx="290"  cy="400" r="3"   fill="#cc1a1a" opacity="0.9"/>
    <circle cx="450"  cy="340" r="2.5" fill="#d4a017" opacity="0.85"/>
    <circle cx="380"  cy="520" r="2"   fill="#ff4444" opacity="0.8"/>
    <circle cx="620"  cy="380" r="2.5" fill="#d4a017" opacity="0.8"/>
    <circle cx="720"  cy="310" r="2"   fill="#cc1a1a" opacity="0.85"/>
    <circle cx="820"  cy="350" r="3"   fill="#d4a017" opacity="0.9"/>
    <circle cx="880"  cy="280" r="2"   fill="#ff4444" opacity="0.75"/>
    <circle cx="1040" cy="280" r="2"   fill="#ff4444" opacity="0.75"/>
    <circle cx="1100" cy="350" r="3"   fill="#d4a017" opacity="0.9"/>
    <circle cx="1200" cy="310" r="2"   fill="#cc1a1a" opacity="0.85"/>
    <circle cx="1300" cy="380" r="2.5" fill="#d4a017" opacity="0.8"/>
    <circle cx="1500" cy="340" r="2.5" fill="#d4a017" opacity="0.85"/>
    <circle cx="1540" cy="520" r="2"   fill="#ff4444" opacity="0.8"/>
    <circle cx="1630" cy="400" r="3"   fill="#cc1a1a" opacity="0.9"/>
    <circle cx="860"  cy="430" r="2.5" fill="#d4a017" opacity="0.85"/>
    <circle cx="1060" cy="430" r="2.5" fill="#d4a017" opacity="0.85"/>
    <circle cx="960"  cy="390" r="3.5" fill="#ffe066" opacity="0.7"/>
    <circle cx="960"  cy="620" r="3"   fill="#d4a017" opacity="0.8"/>
    <circle cx="880"  cy="680" r="2"   fill="#cc1a1a" opacity="0.75"/>
    <circle cx="1040" cy="680" r="2"   fill="#cc1a1a" opacity="0.75"/>
    <circle cx="200"  cy="560" r="2.5" fill="#cc1a1a" opacity="0.75"/>
    <circle cx="1720" cy="560" r="2.5" fill="#cc1a1a" opacity="0.75"/>
  </g>

  <!-- Vignettes -->
  <rect x="0"    y="0"   width="1920" height="240"  fill="url(#ad-vt)"/>
  <rect x="0"    y="830" width="1920" height="250"  fill="url(#ad-vb)"/>
  <rect x="0"    y="0"   width="340"  height="1080" fill="url(#ad-vl)"/>
  <rect x="1580" y="0"   width="340"  height="1080" fill="url(#ad-vr)"/>
</svg>
