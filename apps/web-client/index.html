<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>TG Slots</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060e04;
        overscroll-behavior: none;
      }
      body {
        position: fixed;
        inset: 0;
        touch-action: manipulation;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ── Game Loader ─────────────────────────────────────────────── */
      #game-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--lb, #060e04);
        opacity: 1;
        transition: opacity 0.4s ease;
        cursor: default;
        user-select: none;
      }
      #game-loader.is-fade {
        opacity: 0;
        pointer-events: none;
      }
      .loader-bg {
        position: absolute;
        inset: 0;
        background-image: var(--lbg-img, none);
        background-size: cover;
        background-position: center;
        z-index: 0;
      }
      .loader-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 10%, rgba(0,0,0,0.82) 100%);
        z-index: 1;
      }
      .loader-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 2rem;
        width: 100%;
      }
      .loader-title {
        font-family: 'Cinzel', serif;
        color: var(--lt, #ffe066);
        font-size: clamp(1.4rem, 5vw, 3.5rem);
        font-weight: 900;
        letter-spacing: 0.15em;
        text-align: center;
        text-shadow: 0 0 40px var(--la, #d4a017), 0 2px 8px rgba(0,0,0,0.9);
      }
      .loader-bar {
        width: clamp(180px, 40vw, 420px);
        height: 3px;
        background: rgba(255,255,255,0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--la, #d4a017);
        border-radius: 2px;
        transition: width 0.35s ease;
        box-shadow: 0 0 8px var(--la, #d4a017);
      }
      .loader-status {
        font-family: 'Cinzel', serif;
        color: var(--lt, #ffe066);
        font-size: 0.7rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      @keyframes loader-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      #game-loader.is-tap .loader-status {
        opacity: 0.9;
        animation: loader-pulse 1.6s ease-in-out infinite;
        font-size: 0.8rem;
        letter-spacing: 0.4em;
      }
    </style>
  </head>
  <body>
    <div id="game-loader">
      <div class="loader-bg"></div>
      <div class="loader-vignette"></div>
      <div class="loader-content">
        <h1 class="loader-title"></h1>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
        <p class="loader-status">Loading…</p>
      </div>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
