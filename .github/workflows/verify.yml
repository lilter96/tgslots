name: Workspace verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/x7-server/go.mod
          cache-dependency-path: apps/x7-server/go.sum
      - run: bun run validate
      - run: bun run x7:check
      - run: bun run nine-lives:check
      - name: Verify Bun game modules
        run: |
          PORT=3401 bun apps/api/src/index.ts &
          slot_api_pid=$!
          trap 'kill "$slot_api_pid"' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:3401/health && break
            sleep 0.5
          done
          bun run nine-lives:smoke
